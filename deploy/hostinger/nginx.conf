# Copy to: /etc/nginx/sites-available/studynation
# Then: ln -s /etc/nginx/sites-available/studynation /etc/nginx/sites-enabled/
# Replace SITE_DOMAIN and VPS_IP before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name SITE_DOMAIN www.SITE_DOMAIN VPS_IP;

    client_max_body_size 100M;

    location /static/ {
        alias /var/www/studynation/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/studynation/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/studynation.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
